.lang-btn{height:32px;min-width:42px;padding:0 8px;border:0;background:transparent;border-radius:9px;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:900;transition:.18s}
.lang-btn:hover{color:var(--text);background:var(--surface-2)}
.lang-btn.active{background:var(--navy);color:var(--yellow)}
.install-btn{white-space:nowrap}
.install-btn[hidden]{display:none}
.install-btn .install-label{font-size:11px}
.firebase-status-detail{display:block;font-size:9px;color:#7f8ca1;margin-top:2px}
@media(max-width:620px){.language-switcher .lang-btn span{display:none}.install-btn{min-width:40px;padding:0 9px}.install-btn .install-label{display:none}}

.pin-modal{width:min(390px,100%);padding-bottom:8px}.pin-body{padding:8px 20px 20px}.pin-body p{margin:0 0 14px;color:var(--text-2);font-size:11px;line-height:1.55}.pin-input-wrap{display:flex;justify-content:center}.pin-input{width:100%;max-width:230px;height:52px;text-align:center;letter-spacing:.45em;font-size:22px;font-weight:900;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:13px;outline:0}.pin-input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(243,199,68,.12)}.pin-error{min-height:16px;margin-top:8px;text-align:center;color:var(--red);font-size:10px;font-weight:800}.pin-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.pin-modal.shake{animation:pinShake .25s ease}@keyframes pinShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.secure-dot.connected{background:#42aa7e}.sidebar-footer .secure-dot{transition:.2s}

    <aside class="sidebar" id="sidebar">
      <div class="brand">

          <strong>HMH</strong>

      </div>

        <strong id="workspaceName">HMH Group</strong>
        <span id="workspacePeriod">FY 2026</span>
      </div>

        <span class="nav-title">OVERVIEW</span>
        <button class="nav-item active" data-route="dashboard">{ICON_DASH}<span>Dashboard</span></button>
        <button class="nav-item" data-route="transactions">{ICON_TX}<span>Transactions</span></button>
      </nav>

      <nav class="nav-section">
        <span class="nav-title">FINANCE</span>
        <button class="nav-item" data-route="revenue">{ICON_REVENUE}<span>Revenue</span></button>
        <button class="nav-item" data-route="expenses">{ICON_EXPENSE}<span>Expenses</span></button>
        <button class="nav-item" data-route="invoices">{ICON_INVOICE}<span>Invoices & AR</span></button>
        <button class="nav-item" data-route="cashflow">{ICON_CASH}<span>Cash Flow</span></button>
        <button class="nav-item" data-route="reports">{ICON_REPORT}<span>Reports</span></button>
      </nav>

      <nav class="nav-section">
        <span class="nav-title">OPERATIONS</span>
        <button class="nav-item" data-route="projects">{ICON_PROJECT}<span>Projects</span></button>
        <button class="nav-item" data-route="payroll">{ICON_PAYROLL}<span>Payroll</span></button>
        <button class="nav-item" data-route="assets">{ICON_ASSET}<span>Assets</span></button>
      </nav>

      <div class="sidebar-spacer"></div>
      <nav class="nav-section nav-bottom">
        <button class="nav-item" data-route="settings">{ICON_SETTINGS}<span>Settings</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="secure-dot"></div>
        <span id="connectionStatus">Connecting to Firebase…</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-only" id="mobileNavBtn" aria-label="Open navigation">{ICON_MENU}</button>
          <div>
            <div class="eyebrow" id="pageEyebrow">FINANCE COMMAND CENTER</div>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="period-control">
            <span>{ICON_CALENDAR}</span>
            <select id="periodSelect" aria-label="Reporting period">
              <option value="2026">FY 2026</option>
              <option value="2027">FY 2027</option>
              <option value="2025">FY 2025</option>
            </select>
          </div>
          <div class="language-switcher" aria-label="Language selector">
            <button class="lang-btn" data-language="id" aria-pressed="false" title="Bahasa Indonesia">🇮🇩<span>ID</span></button>
            <button class="lang-btn" data-language="en" aria-pressed="false" title="English">🇬🇧<span>EN</span></button>
          </div>
          <button class="icon-button install-btn" id="installAppBtn" hidden aria-label="Install app" title="Install HMH Finance System">{ICON_DOWNLOAD}<span class="install-label">Install</span></button>
          <button class="icon-button" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark theme">{ICON_SUN}</button>
          <button class="icon-button" id="exportDataBtn" title="Export data as JSON">{ICON_DOWNLOAD}</button>
          <div class="user-chip" aria-label="Finance administrator">
            <span class="avatar">HM</span>
            <span class="user-chip-copy"><strong>Finance Admin</strong><span>Administrator</span></span>
          </div>
        </div>
      </header>

      <div class="mobile-overlay" id="mobileOverlay"></div>
      <section id="pageContainer" class="page-container"></section>
    </main>
  </div>

    function translateDynamicText(s){
      if(language!=='id') return s;
      if(/^\d+ entries$/.test(s)) return s.replace(/^(\d+) entries$/,'$1 entri');
      if(/^\d+ revenue records$/.test(s)) return s.replace(/^(\d+) revenue records$/,'$1 catatan pendapatan');
      if(/^\d+ expense records$/.test(s)) return s.replace(/^(\d+) expense records$/,'$1 catatan pengeluaran');
      if(/^\d+ payroll records$/.test(s)) return s.replace(/^(\d+) payroll records$/,'$1 catatan penggajian');
      if(/^\d+ projects$/.test(s)) return s.replace(/^(\d+) projects$/,'$1 proyek');
      if(/^\d+ assets$/.test(s)) return s.replace(/^(\d+) assets$/,'$1 aset');
      if(/^\d+ accounts$/.test(s)) return s.replace(/^(\d+) accounts$/,'$1 akun');
      if(/^\d+ overdue invoice\(s\)$/.test(s)) return s.replace(/^(\d+) overdue invoice\(s\)$/,'$1 faktur jatuh tempo');
      if(/^For the year ending 31 December \d+$/.test(s)) return s.replace(/^For the year ending 31 December (\d+)$/,'Untuk tahun yang berakhir 31 Desember $1');
      if(/^Across \d+ accounts$/.test(s)) return s.replace(/^Across (\d+) accounts$/,'Di seluruh $1 akun');
      return t(s);
    }
    function applyTranslations(){
      document.documentElement.lang=language;
      const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
      const skipSelector='script,style,input,textarea,td,.mini-list,.account-list,.avatar,.account-avatar';
      const nodes=[]; let node; while((node=walker.nextNode())) nodes.push(node);
      for(const n of nodes){
        const p=n.parentElement; if(!p||p.closest(skipSelector)) continue;
        const raw=n.nodeValue||''; const trimmed=raw.trim(); if(!trimmed) continue;
        const translated=translateDynamicText(trimmed);
        if(translated!==trimmed) n.nodeValue=raw.replace(trimmed,translated);
      }
      document.querySelectorAll('input[placeholder],button[title],[aria-label]').forEach(el=>{
        if(el.matches('input[placeholder]')){ if(!el.dataset.sourcePlaceholder) el.dataset.sourcePlaceholder=el.placeholder; el.placeholder=translateDynamicText(el.dataset.sourcePlaceholder); }
        if(el.hasAttribute('title')){ if(!el.dataset.sourceTitle) el.dataset.sourceTitle=el.title; el.title=translateDynamicText(el.dataset.sourceTitle); }
        if(el.hasAttribute('aria-label')){ if(!el.dataset.sourceAria) el.dataset.sourceAria=el.getAttribute('aria-label'); el.setAttribute('aria-label',translateDynamicText(el.dataset.sourceAria)); }
      });
      document.querySelectorAll('option').forEach(o=>{ const source=o.dataset.sourceText||o.textContent.trim(); o.dataset.sourceText=source; o.textContent=translateDynamicText(source); });
      document.title=language==='id'?'Sistem Keuangan HMH':'HMH Finance System';
      updateLanguageControls();
    }

    function firebaseErrorMessage(err){
      const code=err?.code||'';
      if(code.includes('permission-denied')) return t('Firestore access was denied. Check your Firestore Security Rules and, if they require request.auth, enable Anonymous Authentication in Firebase Console.');
      if(code.includes('failed-precondition')) return t('Firestore is not fully configured. Open Firebase Console and create/enable Cloud Firestore.');
      if(code.includes('unavailable') || code.includes('deadline-exceeded')) return t('Firebase is temporarily unavailable. Check your connection and try again.');
      if(code.includes('not-found')) return t('Firestore database was not found for this Firebase project.');
      if(code.includes('unauthenticated')) return t('Firebase requires authentication for this Firestore operation.');
      if(code.includes('auth/operation-not-allowed')) return t('Anonymous authentication is not enabled')+' — '+t('Enable Anonymous Authentication in Firebase Console to use authenticated Firestore rules.');
      return err?.message || t('Firebase request failed.');
    }
    function firebaseStatusForError(err){
      const code=err?.code||'';
      if(code.includes('permission-denied')) return t('Cloud access blocked');
      if(code.includes('failed-precondition') || code.includes('not-found')) return t('Firestore setup required');
      if(code.includes('unavailable') || code.includes('deadline-exceeded')) return t('Cloud unavailable');
      return t('Cloud connection error');
    }

    function fmtMoney(n, compact=false){
      const amount = Number(n||0);
      if (compact) {
        const a=Math.abs(amount);
        if (a>=1e9) return (amount/1e9).toFixed(1)+' B';
        if (a>=1e6) return (amount/1e6).toFixed(1)+' M';
        if (a>=1e3) return (amount/1e3).toFixed(0)+' K';
      }
      return new Intl.NumberFormat(language==='id'?'id-ID':'en-US',{style:'currency',currency:state.data.settings.currency||'IDR',maximumFractionDigits:0}).format(amount);

    function sanitizeLegacyDemoData(data){
      const next=deepClone(data||defaultData);
      next.settings={...defaultSettings,...(next.settings||{})};
      delete next.settings.openingCash;
      delete next.settings.fiscalStart;
      const legacyAccountBalances={'ACC-001':85000000,'ACC-002':30000000,'ACC-003':10000000};
      next.accounts=Array.isArray(next.accounts)?next.accounts.map(a=>{
        if(Object.prototype.hasOwnProperty.call(legacyAccountBalances,a.id)){
          const opening=Number(a.openingBalance||0), balance=Number(a.balance||0), legacy=legacyAccountBalances[a.id];
          if(opening===legacy || balance===legacy) { const clean={...a,openingBalance:0}; delete clean.balance; return clean; }
        }
        return a;
      }):[];
      RECORD_MODULES.forEach(module=>{
        next[module]=Array.isArray(next[module])?next[module].filter(x=>!LEGACY_DEMO_RECORD_IDS.has(x.id)):[];
      });
      next.budgets=Array.isArray(next.budgets)?next.budgets.filter(x=>!['BUD-001','BUD-002','BUD-003','BUD-004','BUD-005','BUD-006'].includes(x.id)):[];
      return next;
    }
    async function cleanLegacyDemoData(){
      if(!db) return;
      try{
        const sSnap=await getDoc(settingsRef());
        if(sSnap.exists() && Number(sSnap.data()?.legacyDemoCleanupVersion||0)>=1) return;
        const snap=await getDocs(recordsRef());
        const stale=snap.docs.filter(d=>LEGACY_DEMO_RECORD_IDS.has(d.id));
        if(stale.length){
          let batch=writeBatch(db),count=0;
          for(const d of stale){ batch.delete(d.ref); if(++count===450){ await batch.commit(); batch=writeBatch(db); count=0; }}
          if(count) await batch.commit();
        }
        const accSnap=await getDocs(accountsRef());
        let batch=writeBatch(db),count=0;
        const legacyAccountBalances={'ACC-001':85000000,'ACC-002':30000000,'ACC-003':10000000};
        for(const d of accSnap.docs){
          const x=d.data();
          if(Object.prototype.hasOwnProperty.call(legacyAccountBalances,d.id)){
            const opening=Number(x.openingBalance||0),balance=Number(x.balance||0),legacy=legacyAccountBalances[d.id];
            if(opening===legacy || balance===legacy){
              const clean={...x,id:d.id,openingBalance:0}; delete clean.balance;
              batch.set(d.ref,clean,{merge:true}); count++;
            }
          }
          if(count===450){ await batch.commit(); batch=writeBatch(db); count=0; }
        }
        if(count) await batch.commit();
        await setDoc(settingsRef(),{legacyDemoCleanupVersion:1},{merge:true});
      }catch(err){ console.warn('Legacy demo cleanup skipped:',err); }
    }
    function getMonths(){ return Array.from({length:12},(_,i)=>`${state.data.settings.year}-${String(i+1).padStart(2,'0')}`); }
    function sum(arr,key){ return arr.reduce((a,x)=>a+Number(x[key]||0),0); }
    function getRevenue(){ return state.data.revenue.filter(x=>String(x.date||'').startsWith(String(state.data.settings.year))); }
    function getExpenses(){ return state.data.expenses.filter(x=>String(x.date||'').startsWith(String(state.data.settings.year))); }
    function getInvoices(){ return state.data.invoices.filter(x=>String(x.date||'').startsWith(String(state.data.settings.year))); }
    function getTransactions(){ return state.data.transactions.filter(x=>String(x.date||'').startsWith(String(state.data.settings.year))); }
    function totalRevenue(){ return sum(getRevenue(),'amount'); }
    function totalExpenses(){ return sum(getExpenses(),'amount'); }
    function totalPayroll(){ return state.data.payroll.filter(x=>String(x.month||'').startsWith(String(state.data.settings.year))).reduce((a,x)=>a+Number(x.base||0)+Number(x.allowance||0),0); }
    function totalAR(){ return getInvoices().filter(x=>x.status!=='Paid').reduce((a,x)=>a+Number(x.amount||0),0); }
    function cashBalance(){
      return (state.data.accounts||[]).reduce((a,x)=>a+accountBalance(x.name),0);
    }
    function paidRevenue(){ return getRevenue().filter(x=>x.status==='Paid').reduce((a,x)=>a+Number(x.amount||0),0); }
    function paidExpenses(){ return getExpenses().filter(x=>x.status==='Paid').reduce((a,x)=>a+Number(x.amount||0),0); }
    function opProfit(){ return totalRevenue() - totalExpenses() - totalPayroll(); }
    function margin(){ return totalRevenue() ? opProfit()/totalRevenue()*100 : 0; }
    function directCosts(){ return getExpenses().filter(x=>x.type==='Direct Cost').reduce((a,x)=>a+Number(x.amount||0),0); }
    function statusBadge(status){
      const map={Paid:'success',Completed:'success',Active:'info',Pending:'warning',Overdue:'danger',Draft:'muted','At Risk':'danger'};
      const cls=map[status]||'muted'; return `<span class="badge ${cls}">${esc(t(status))}</span>`;
    }
    function trendBadge(v, positive=true){
      const val=Number(v||0); const cls=(val>=0)===positive?'positive':'negative';
      const icon=val>=0?ICON_ARROW_UP:ICON_ARROW_DOWN;
      return `<span class="trend ${cls}">${icon}${Math.abs(val).toFixed(1)}%</span>`;
    }
    function toast(msg,type='info'){
      const c=document.getElementById('toastContainer'); const el=document.createElement('div');
      el.className=`toast ${type}`; el.innerHTML=`<span class="toast-dot"></span><span>${esc(msg)}</span>`; c.appendChild(el);
      setTimeout(()=>el.classList.add('hide'),2400); setTimeout(()=>el.remove(),3000);
    }
    function chartLine(values, labels, options={}){
      const w=options.w||720,h=options.h||250,pad=options.pad||30,max=Math.max(1,...values),min=Math.min(0,...values),range=max-min||1;
      const x=i=>pad+(w-pad*2)*(i/(values.length-1||1));
      const y=v=>h-pad-(h-pad*2)*((v-min)/range);
      const pts=values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
      let dots=''; values.forEach((v,i)=>{dots+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--yellow)" stroke="var(--surface)" stroke-width="2"/>`;});
      let grid=''; for(let i=0;i<4;i++){ const gy=pad+(h-pad*2)*(i/3); grid+=`<line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" class="chart-grid"/>`; }
      let labs=labels.map((l,i)=>`<text x="${x(i)}" y="${h-6}" class="chart-label" text-anchor="middle">${esc(l)}</text>`).join('');
      return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg"><defs><linearGradient id="lineFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--yellow)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--yellow)" stop-opacity="0"/></linearGradient></defs>${grid}<polyline points="${pts} ${x(values.length-1)},${h-pad} ${x(0)},${h-pad}" fill="url(#lineFill)" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(--yellow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labs}</svg>`;
    }
    function donutChart(values, labels, colors){
      const total=values.reduce((a,b)=>a+b,0)||1; let acc=0; const r=54,cx=80,cy=80,circ=2*Math.PI*r;
      let rings=''; values.forEach((v,i)=>{ const dash=(v/total)*circ; const off=-(acc/total)*circ; rings+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="20" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${off}"/>`; acc+=v; });
      const list=labels.map((l,i)=>`<div class="legend-item"><span class="legend-dot" style="background:${colors[i%colors.length]}"></span><span>${esc(l)}</span><strong>${Math.round(values[i]/total*100)}%</strong></div>`).join('');
      return `<div class="donut-wrap"><svg viewBox="0 0 160 160" class="donut"><circle cx="80" cy="80" r="54" fill="none" stroke="var(--border)" stroke-width="20"/>${rings}<circle cx="80" cy="80" r="36" fill="var(--surface)"/><text x="80" y="76" text-anchor="middle" class="donut-total">${Math.round(total?100:0)}%</text><text x="80" y="94" text-anchor="middle" class="donut-label">allocation</text></svg><div class="legend">${list}</div></div>`;
    }
    function emptyState(title='No records found',desc='Add a record to start building your finance workspace.'){

      const recent=getTransactions().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);

      <div class="grid-2-1">

        <section class="panel">
          <div class="panel-head"><div><span class="section-kicker">SPEND MIX</span><h3>Expense allocation</h3></div><button class="icon-button subtle" data-route="expenses">${ICON_MORE}</button></div>
          ${topCats.length ? donutChart(topCats.map(x=>x[1]),topCats.map(x=>x[0]),colors) : emptyState('No expenses','Add your first expense to see allocation.')}

      <div class="grid-2-1">
        <section class="panel">
          <div class="panel-head"><div><span class="section-kicker">RECENT ACTIVITY</span><h3>Latest transactions</h3></div><button class="text-button" data-route="transactions">View all ${ICON_CHEVRON}</button></div>
          <div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Account</th><th>Amount</th></tr></thead><tbody>
            ${recent.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><strong>${esc(x.description)}</strong><small>${esc(x.reference||x.category)}</small></td><td>${esc(x.account)}</td><td class="money ${x.direction==='Inflow'?'money-in':'money-out'}">${x.direction==='Inflow'?'+':'-'}${fmtMoney(x.amount)}</td></tr>`).join('') || `<tr><td colspan="4">${emptyState()}</td></tr>`}
          </tbody></table></div>

          <div class="panel-head"><div><span class="section-kicker">PORTFOLIO</span><h3>Project profitability</h3></div><button class="text-button" data-route="projects">Open projects ${ICON_CHEVRON}</button></div>
          <div class="mini-list">${projectRows.map(p=>`<div class="mini-row"><div><strong>${esc(p.name)}</strong><small>${esc(p.client)}</small></div><div class="mini-row-right"><strong>${fmtMoney(p.profit,true)}</strong><span>${p.margin.toFixed(0)}% margin</span></div></div>`).join('') || emptyState('No projects')}</div>
        </section>

    function kpiCard(title,value,sub,raw,type){

    function renderPnlReport(rev,direct,opex,payroll,gross,op){
      return `<div class="report-grid"><section class="panel report-sheet"><div class="report-brand"><div class="brand-mark small">HMH</div><div><strong>${esc(state.data.settings.companyName)}</strong><span>Statement of Profit or Loss</span></div></div><div class="report-meta">For the year ending 31 December ${state.data.settings.year}</div><div class="report-lines"><div class="report-line section"><span>Revenue</span><strong>${fmtMoney(rev)}</strong></div><div class="report-line"><span>Direct costs</span><span>(${fmtMoney(direct)})</span></div><div class="report-line total"><span>Gross profit</span><strong>${fmtMoney(gross)}</strong></div><div class="report-line section"><span>Operating expenses</span><strong>${fmtMoney(opex+payroll)}</strong></div><div class="report-line"><span>Other operating expense</span><span>(${fmtMoney(opex)})</span></div><div class="report-line"><span>Payroll</span><span>(${fmtMoney(payroll)})</span></div><div class="report-line total highlight"><span>Operating profit</span><strong>${fmtMoney(op)}</strong></div></div></section><section class="panel"><div class="panel-head"><div><span class="section-kicker">MANAGEMENT KPIs</span><h3>Key ratios</h3></div></div><div class="ratio-grid"><div><span>Gross margin</span><strong>${rev?(gross/rev*100).toFixed(1):'0.0'}%</strong></div><div><span>Operating margin</span><strong>${rev?(op/rev*100).toFixed(1):'0.0'}%</strong></div><div><span>Payroll ratio</span><strong>${rev?(payroll/rev*100).toFixed(1):'0.0'}%</strong></div><div><span>Direct cost ratio</span><strong>${rev?(direct/rev*100).toFixed(1):'0.0'}%</strong></div></div><div class="report-callout"><strong>Management note</strong><span>Use the dashboard and project module to identify which client work is driving margin and where delivery costs are increasing.</span></div></section></div>`;

    function renderCashReport(){ const months=getMonths(); const inflow=months.map(m=>getTransactions().filter(x=>x.date.startsWith(m)&&x.direction==='Inflow').reduce((a,x)=>a+x.amount,0)); const outflow=months.map(m=>getTransactions().filter(x=>x.date.startsWith(m)&&x.direction==='Outflow').reduce((a,x)=>a+x.amount,0)); const net=inflow.map((x,i)=>x-outflow[i]); return `<div class="report-grid"><section class="panel panel-chart"><div class="panel-head"><div><span class="section-kicker">CASH REPORT</span><h3>Monthly net cash</h3></div></div>${chartLine(net,months.map(monthLabel))}</section><section class="panel"><div class="panel-head"><div><span class="section-kicker">LIQUIDITY</span><h3>Current position</h3></div></div><div class="big-metric">${fmtMoney(cashBalance())}<span>Current cash balance</span></div><div class="ratio-grid"><div><span>Open AR</span><strong>${fmtMoney(totalAR(),true)}</strong></div><div><span>Paid revenue</span><strong>${fmtMoney(paidRevenue(),true)}</strong></div><div><span>Paid expenses</span><strong>${fmtMoney(paidExpenses(),true)}</strong></div><div><span>Net cash movement</span><strong>${fmtMoney(net.reduce((a,b)=>a+b,0),true)}</strong></div></div></section></div>`; }
    function renderManagementReport(){ return `<div class="management-grid"><div class="management-card"><span>Revenue</span><strong>${fmtMoney(totalRevenue())}</strong><small>YTD</small></div><div class="management-card"><span>Operating profit</span><strong>${fmtMoney(opProfit())}</strong><small>${margin().toFixed(1)}% margin</small></div><div class="management-card"><span>Cash</span><strong>${fmtMoney(cashBalance())}</strong><small>${translateDynamicText('Across '+state.data.accounts.length+' accounts')}</small></div><div class="management-card"><span>AR exposure</span><strong>${fmtMoney(totalAR())}</strong><small>${translateDynamicText(getInvoices().filter(x=>x.status==='Overdue').length+' overdue invoice(s)')}</small></div></div><section class="panel"><div class="panel-head"><div><span class="section-kicker">MANAGEMENT FOCUS</span><h3>Areas to review</h3></div></div><div class="focus-list"><div><span class="focus-dot warning"></span><div><strong>Receivable exposure</strong><p>${fmtMoney(totalAR())} ${language==='id'?'masih terbuka pada faktur saat ini.':'remains open across current invoices.'}</p></div></div><div><span class="focus-dot yellow"></span><div><strong>Project margin</strong><p>${language==='id'?'Tinjau proyek aktif dengan margin di bawah 20% sebelum menambah lingkup pekerjaan.':'Review active projects with margins below 20% before adding delivery scope.'}</p></div></div><div><span class="focus-dot blue"></span><div><strong>Cash visibility</strong><p>${language==='id'?'Pastikan saldo akun direkonsiliasi dengan rekening koran bank eksternal.':'Keep account balances reconciled with your external bank statements.'}</p></div></div></div></section>`; }


    function accountBalance(accountName){
      const acc=state.data.accounts.find(a=>a.name===accountName);
      const opening=Number(acc?.openingBalance||0);
      const movement=(state.data.transactions||[]).filter(t=>t.account===accountName).reduce((a,t)=>a+(t.direction==='Inflow'?1:-1)*Number(t.amount||0),0);
      return opening+movement;
    }

    function linkedTransactionFor(route,obj){
      if(route==='revenue' && obj.status==='Paid') return {date:obj.date,description:`${obj.client} — ${obj.project}`,category:obj.category,direction:'Inflow',amount:Number(obj.amount||0),account:obj.account,reference:obj.id};
      if(route==='expenses' && obj.status==='Paid') return {date:obj.date,description:obj.vendor,category:obj.category,direction:'Outflow',amount:Number(obj.amount||0),account:obj.account,reference:obj.id};
      if(route==='payroll' && obj.status==='Paid') return {date:`${obj.month}-01`,description:`Payroll — ${obj.employee}`,category:'Payroll',direction:'Outflow',amount:Number(obj.base||0)+Number(obj.allowance||0)-Number(obj.deduction||0),account:obj.account||state.data.accounts[0]?.name||'',reference:obj.id};
      return null;
    }

    async function saveRecord(route,obj,existing=null){
      const batch=writeBatch(db);
      if(route==='accounts'){
        const id=obj.id || uid('ACC');
        batch.set(accountRef(id),{...obj,id});
      }else{
        const id=obj.id || uid(route.slice(0,3).toUpperCase());
        obj.id=id;
        batch.set(recordRef(id),{...obj,module:route,id});
        if(['revenue','expenses','payroll'].includes(route)){
          const oldLinked=getTransactions().concat(state.data.transactions||[]).find(t=>t.reference===(existing?.id||obj.id));
          const next=linkedTransactionFor(route,obj);
          if(oldLinked && !next) batch.delete(recordRef(oldLinked.id));
          if(next){
            const txId=oldLinked?.id || uid('TRX');
            batch.set(recordRef(txId),{...next,module:'transactions',id:txId});
          }
        }
      }
      await batch.commit();
      saveLocalSnapshot();
      toast(existing?t('Record updated'):t('Record created'),'success');
    }

    async function deleteRecord(route,id){
      if(!db) return;
      const coll=route==='accounts'?state.data.accounts:state.data[route]; const obj=coll?.find(x=>x.id===id); if(!obj) return;
      if(!confirm(`${t('Delete')} ${id}? ${t('This action cannot be undone.')}`)) return;
      try{
        const batch=writeBatch(db);
        if(route==='accounts'){
          if(getTransactions().some(t=>t.account===obj.name)){ toast(t('Account cannot be deleted while transactions reference it.'),'warning'); return; }
          batch.delete(accountRef(id));
        }else{
          batch.delete(recordRef(id));
          if(['revenue','expenses','payroll'].includes(route)){
            const linked=getTransactions().find(t=>t.reference===id); if(linked) batch.delete(recordRef(linked.id));
          }
        }
        await batch.commit(); saveLocalSnapshot(); toast(t('Record deleted'),'success');
      }catch(err){toast(firebaseErrorMessage(err),'danger');}
    }

    function requireActionPin(action,onSuccess){
      const title=action==='edit'?t('Confirm edit'):t('Confirm delete');
      const message=action==='edit'?t('Enter the 4-digit PIN to edit this record.'):t('Enter the 4-digit PIN to delete this record.');
      const modal=document.getElementById('modalRoot');
      modal.innerHTML=`<div class="modal-backdrop" id="pinBackdrop"><div class="modal pin-modal"><div class="modal-head"><div><span class="section-kicker">${esc(t('SECURITY'))}</span><h3>${esc(title)}</h3></div><button class="icon-button subtle" type="button" data-pin-close>${ICON_CLOSE}</button></div><div class="pin-body"><p>${esc(message)}</p><div class="pin-input-wrap"><input id="actionPinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="4-digit PIN"/></div><div id="pinError" class="pin-error"></div><div class="pin-actions"><button class="btn btn-secondary" type="button" data-pin-close>${esc(t('Cancel'))}</button><button class="btn btn-primary" type="button" id="pinConfirmBtn">${ICON_CHECK}<span>${esc(t('Confirm'))}</span></button></div></div></div></div>`;
      const input=document.getElementById('actionPinInput'),error=document.getElementById('pinError'),box=document.querySelector('.pin-modal');
      const close=()=>{modal.innerHTML='';};
      document.querySelectorAll('[data-pin-close]').forEach(b=>b.addEventListener('click',close));
      const verify=()=>{
        const pin=input.value.trim();
        if(!/^\d{4}$/.test(pin)){error.textContent=t('PIN must be 4 digits');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');input.focus();return;}
        if(pin!==ADMIN_PIN){error.textContent=t('Incorrect PIN');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');input.select();return;}
        close();
        Promise.resolve(onSuccess()).catch(err=>toast(firebaseErrorMessage(err),'danger'));
      };
      input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,4);error.textContent='';});
      input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verify();}if(e.key==='Escape')close();});
      document.getElementById('pinConfirmBtn').addEventListener('click',verify);
      input.focus();
    }

        invoices:{title:id?'Edit invoice':'Create invoice',fields:[['id','Invoice number','text',existing?.id||`INV-${state.data.settings.year}-${String(state.data.invoices.length+1).padStart(3,'0')}`],['date','Invoice date','date',existing?.date||new Date().toISOString().slice(0,10)],['due','Due date','date',existing?.due||new Date(Date.now()+14*86400000).toISOString().slice(0,10)],['client','Client','text',existing?.client||''],['project','Project','text',existing?.project||''],['amount','Amount','number',existing?.amount||0],['status','Status','select',existing?.status||'Pending',['Pending','Paid','Overdue']]]},
        projects:{title:id?'Edit project':'Add project',fields:[['id','Project ID','text',existing?.id||uid('PRJ')],['client','Client','text',existing?.client||''],['name','Project name','text',existing?.name||''],['revenue','Contract value','number',existing?.revenue||0],['directCost','Direct cost','number',existing?.directCost||0],['overhead','Overhead allocation','number',existing?.overhead||0],['status','Status','select',existing?.status||'Active',['Active','Completed','At Risk','Draft']]]},
        payroll:{title:id?'Edit payroll':'Add payroll',fields:[['id','Payroll ID','text',existing?.id||uid('PAY')],['month','Month','month',existing?.month||`${state.data.settings.year}-${String(new Date().getMonth()+1).padStart(2,'0')}`],['employee','Employee','text',existing?.employee||''],['role','Role','text',existing?.role||''],['base','Base salary','number',existing?.base||0],['allowance','Allowance','number',existing?.allowance||0],['deduction','Deduction','number',existing?.deduction||0],['account','Account','select',existing?.account||state.data.accounts[0]?.name||'',state.data.accounts.map(a=>a.name)],['status','Status','select',existing?.status||'Paid',['Paid','Pending']]]},
        assets:{title:id?'Edit asset':'Add asset',fields:[['id','Asset ID','text',existing?.id||uid('AST')],['date','Purchase date','date',existing?.date||new Date().toISOString().slice(0,10)],['name','Asset name','text',existing?.name||''],['category','Category','select',existing?.category||'IT Equipment',['IT Equipment','Furniture','Production','Vehicle','Other']],['cost','Purchase cost','number',existing?.cost||0],['usefulLife','Useful life (years)','number',existing?.usefulLife||4],['method','Depreciation method','select',existing?.method||'Straight-line',['Straight-line']],['status','Status','select',existing?.status||'Active',['Active','Disposed']]],}
      };
      if(!schemas[route]) return;
      const s=schemas[route];
      const fields=s.fields.map(f=>{const [name,label,type,value,opts]=f;let input='';const readonly=(existing&&(name==='id'||(route==='accounts'&&name==='name'))) ? 'readonly' : '';if(type==='textarea')input=`<textarea name="${name}" rows="3">${esc(value)}</textarea>`;else if(type==='select')input=`<select name="${name}">${opts.map(o=>`<option value="${esc(o)}" data-source-text="${esc(o)}" ${String(value)===String(o)?'selected':''}>${esc(t(o))}</option>`).join('')}</select>`;else input=`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="1" min="0"':''} ${readonly}/>`;return `<label><span>${esc(t(label))}</span>${input}</label>`;}).join('');
      document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><div><span class="section-kicker">${esc(routes[route]?.eyebrow||'FINANCE')}</span><h3>${esc(s.title)}</h3></div><button class="icon-button subtle" data-modal-close>${ICON_CLOSE}</button></div><form id="recordForm" class="form-grid">${fields}<div class="modal-actions"><button type="button" class="btn btn-secondary" data-modal-close>${t('Cancel')}</button><button class="btn btn-primary" type="submit">${ICON_CHECK}<span>${t(id?'Save changes':'Create record')}</span></button></div></form></div></div>`;
      document.querySelectorAll('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));
      document.getElementById('recordForm').addEventListener('submit',async e=>{e.preventDefault();try{const fd=new FormData(e.target),obj={};for(const[k,v]of fd.entries())obj[k]=(e.target.elements[k]?.type==='number'?Number(v):v);if(route==='accounts'&&!obj.id)obj.id=uid('ACC');if(route!=='accounts'&&!obj.id)obj.id=uid(route.slice(0,3).toUpperCase());await saveRecord(route,obj,existing);closeModal();}catch(err){toast(firebaseErrorMessage(err),'danger');}});
    }
    function closeModal(){ document.getElementById('modalRoot').innerHTML=''; state.editId=null; }
    async function toggleTheme(){
      const next=state.data.settings.theme==='dark'?'light':'dark';
      localStorage.setItem('hmh_theme',next); state.data.settings.theme=next; applyTheme(); render();
    }

    function exportJson(){
      const payload={exportedAt:new Date().toISOString(),companyId:COMPANY_ID,settings:state.data.settings,accounts:state.data.accounts,revenue:state.data.revenue,expenses:state.data.expenses,invoices:state.data.invoices,transactions:state.data.transactions,projects:state.data.projects,payroll:state.data.payroll,assets:state.data.assets};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hmh-finance-firebase-backup-${state.data.settings.year}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(t('Firebase workspace backup downloaded'),'success');
    }

    async function importJsonToFirebase(parsed){
      if(!parsed?.settings) throw new Error('Invalid backup');
      const recSnap=await getDocs(recordsRef());
      let batch=writeBatch(db),count=0;
      for(const d of recSnap.docs){batch.delete(d.ref);if(++count===450){await batch.commit();batch=writeBatch(db);count=0;}}
      if(count)await batch.commit();
      const accSnap=await getDocs(accountsRef()); batch=writeBatch(db);count=0;
      for(const d of accSnap.docs){batch.delete(d.ref);if(++count===450){await batch.commit();batch=writeBatch(db);count=0;}}
      const importedAccounts=Array.isArray(parsed.accounts)?parsed.accounts:[];importedAccounts.forEach(a=>{const id=a.id||uid('ACC');batch.set(accountRef(id),{...a,id});count++;});
      if(count)await batch.commit();
      {const cleanSettings={...defaultSettings,...parsed.settings};delete cleanSettings.theme;await setDoc(settingsRef(),cleanSettings);}
      batch=writeBatch(db);count=0;
      for(const module of RECORD_MODULES){for(const x of (Array.isArray(parsed[module])?parsed[module]:[])){const id=x.id||uid(module.slice(0,3).toUpperCase());batch.set(recordRef(id),{...x,id,module});if(++count===450){await batch.commit();batch=writeBatch(db);count=0;}}}
      if(count)await batch.commit();
      saveLocalSnapshot();
    }

    function exportCurrentTable(){ const table=document.querySelector('#dataTable'); if(!table){toast(t('No table to export'),'warning');return;} const headers=[...table.querySelectorAll('thead th')].slice(0,-1).map(x=>x.textContent.trim()); const rows=[...table.querySelectorAll('tbody tr')].filter(x=>x.style.display!=='none').map(tr=>[...tr.querySelectorAll('td')].slice(0,-1).map(td=>td.innerText.trim().replace(/\n+/g,' '))); downloadCsv(rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||'']))),state.route); }
    function downloadCsv(rows,name){ if(!rows.length){toast(t('No data to export'),'warning');return;} const headers=Object.keys(rows[0]); const csv=[headers.join(','),...rows.map(r=>headers.map(h=>`"${String(r[h]??'').replace(/"/g,'""')}"`).join(','))].join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hmh-${name}-${state.data.settings.year}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(t('CSV exported'),'success'); }

    const LOCAL_SNAPSHOT_KEY='hmh_finance_snapshot_v2';
    function saveLocalSnapshot(){
      try{ localStorage.setItem(LOCAL_SNAPSHOT_KEY,JSON.stringify(state.data)); }catch(_){}
    }
    function restoreLocalSnapshot(){
      try{
        const raw=localStorage.getItem(LOCAL_SNAPSHOT_KEY); if(!raw) return false;
        const parsed=JSON.parse(raw); if(!parsed||!parsed.settings) return false;
        state.data=sanitizeLegacyDemoData({...deepClone(defaultData),...parsed,settings:{...deepClone(defaultData.settings),...(parsed.settings||{})}});
        saveLocalSnapshot();
        return true;
      }catch(_){return false;}
    }

    async function initFirebase(){
      restoreLocalSnapshot();
      state.data.settings.theme=localStorage.getItem('hmh_theme')||state.data.settings.theme||'dark';
      const savedYear=localStorage.getItem('hmh_year');
      if(savedYear) state.data.settings.year=Number(savedYear);
      language=localStorage.getItem('hmh_language')||'id';
      applyTheme(); updateLanguageControls(); render();
      if(!firebaseIsConfigured()){
        setConnection(t('Configuration required'),false);
        toast(t('Firebase configuration is incomplete. The dashboard is shown, but cloud sync is unavailable.'),'warning');
        return;
      }
      try{
        firebaseApp=getApps().length?getApp():initializeApp(firebaseConfig);
        try{ await ensureAnonymousAuth(); }catch(authErr){ console.warn('Firebase Authentication:',authErr); }
        db=getFirestore(firebaseApp);
        await cleanLegacyDemoData();
        await startRealtimeSync();
      }catch(err){
        console.error(err);
        state.syncing=false; state.ready=false;
        setConnection(firebaseStatusForError(err),false);
        toast(firebaseErrorMessage(err),'danger');
      }
    }

    let deferredInstallPrompt=null;
    function isStandalone(){ return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches; }
    function updateInstallButton(){ const b=document.getElementById('installAppBtn'); if(!b)return; b.hidden=!!deferredInstallPrompt?false:true; if(isStandalone()) b.hidden=true; }
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButton();});
    window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButton();toast(t('App installed'),'success');});

    document.addEventListener('click',e=>{ const routeBtn=e.target.closest('[data-route]'); if(routeBtn){ state.route=routeBtn.dataset.route; render(); } });
    document.getElementById('periodSelect').addEventListener('change',e=>{ const year=Number(e.target.value); localStorage.setItem('hmh_year',String(year)); state.data.settings.year=year; render(); });
    document.getElementById('themeToggle').addEventListener('click',toggleTheme);
    document.getElementById('exportDataBtn').addEventListener('click',exportJson);
    document.querySelectorAll('[data-language]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.language)));
    document.getElementById('installAppBtn').addEventListener('click',async()=>{if(!deferredInstallPrompt){toast(t('Install option is not available yet.')+' '+t('Use Chrome menu → Install HMH Finance System when the option appears.'),'warning');return;}const p=deferredInstallPrompt;deferredInstallPrompt=null;updateInstallButton();try{await p.prompt();await p.userChoice;}catch(err){console.error(err);toast(err?.message||t('Install option is not available yet.'),'warning');}});
    document.getElementById('mobileNavBtn').addEventListener('click',openMobileNav);
    document.getElementById('mobileOverlay').addEventListener('click',closeMobileNav);
    function openMobileNav(){document.getElementById('sidebar').classList.add('open');document.getElementById('mobileOverlay').classList.add('show');}
    function closeMobileNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');}
    document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const parsed=JSON.parse(r.result);await importJsonToFirebase(parsed);toast(t('Backup restored to Firebase'),'success');}catch(err){console.error(err);toast(firebaseErrorMessage(err),'danger');}};r.readAsText(f);e.target.value='';});

    document.querySelectorAll('.nav-item').forEach(btn=>{const label=btn.querySelector('span')?.textContent?.trim()||btn.textContent.trim();btn.innerHTML=({dashboard:ICON_DASH,transactions:ICON_TX,revenue:ICON_REVENUE,expenses:ICON_EXPENSE,invoices:ICON_INVOICE,cashflow:ICON_CASH,reports:ICON_REPORT,projects:ICON_PROJECT,payroll:ICON_PAYROLL,assets:ICON_ASSET,settings:ICON_SETTINGS}[btn.dataset.route]||'')+'<span>'+label+'</span>';});
    document.querySelector('.period-control > span').innerHTML=ICON_CALENDAR;
    document.getElementById('themeToggle').innerHTML=ICON_SUN;
    document.getElementById('exportDataBtn').innerHTML=ICON_DOWNLOAD;
    document.getElementById('mobileNavBtn').innerHTML=ICON_MENU;
    updateInstallButton();
    updateLanguageControls();
    updateDashboardGreeting();
    setInterval(updateDashboardGreeting,60000);
    if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Service worker registration failed:',err))); }
    initFirebase();
  
  </script>
</body>
</html>
